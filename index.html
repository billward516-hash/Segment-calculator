  }

  function renderHelp() {
    $('#secHelp').innerHTML = '<h2>Help and glossary</h2><details><summary class="btn" style="display:inline-flex;align-items:center">Show glossary</summary><dl class="gloss">' +
      '<dt>Segment</dt><dd>One wedge-shaped piece. Segments glue end to end to make a ring.</dd>' +
      '<dt>Miter angle</dt><dd>The angle each end is cut, measured from square. For equal segments it is 180° ÷ number of segments (12 segments = 15°).</dd>' +
      '<dt>Long point / short point</dt><dd>The outside and inside edge lengths of a segment. Set your stop block to the long point.</dd>' +
      '<dt>Strip</dt><dd>A board ripped to the segment width and thickness. You cut segments from it, flipping it between cuts.</dd>' +
      '<dt>Kerf</dt><dd>The width of wood the blade turns into sawdust.</dd>' +
      '<dt>Safety length</dt><dd>Extra strip length (5″ by default) so you never hold a tiny piece near the blade. Shown as its own line in every strip.</dd>' +
      '<dt>Closed ring</dt><dd>Segments touch all the way around. Watertight when glued well.</dd>' +
      '<dt>Open segment ring</dt><dd>Segments have gaps between them. Decorative only — will not hold water.</dd>' +
      '<dt>Brick lay</dt><dd>Turning a ring half a segment so joints sit over the middle of the segments below, like bricks.</dd>' +
      '<dt>Turning allowance</dt><dd>Extra wood beyond the finished surface (1/8″ per side by default) so the lathe can true it up.</dd>' +
      '<dt>Sanding allowance</dt><dd>Extra thickness per ring so you can flatten both faces before stacking.</dd>' +
      '<dt>Feature ring</dt><dd>An accent ring with a different pattern, often with veneer between segments.</dd>' +
      '<dt>Board foot</dt><dd>12″ × 12″ × 1″ of wood. Lumber is sold by the board foot.</dd>' +
      '</dl></details>' +
      '<p class="help" style="margin-top:12px">Segment Calculator is free to use and share. It runs entirely on your device — nothing is uploaded. Check measurements with a test cut before cutting your good wood.</p>';
  }

  // ---------- Results ----------
  function renderResults() {
    const R = C.computeDesign(design, state.customSpecies);
    lastResult = R;
    const s = design.settings;
    if (selectedRing >= design.rings.length) selectedRing = Math.max(0, design.rings.length - 1);
    const errorCount = R.messages.filter((m) => m.level === 'error').length;
    let h = '';

    // Summary
    h += '<section class="card" id="secSummary"><h2><span class="step">Step 5</span>Results</h2><div class="stats">' +
      stat('Rings', design.rings.length) +
      stat('Total pieces', R.cut.totalPieces) +
      stat('Finished height', fmt(R.finishedH)) +
      stat('Rough stack height', fmt(R.roughH)) +
      stat('Largest diameter', fmt(2 * R.maxR)) +
      stat('Strips to rip', R.cut.strips.length) +
      '</div>';
    if (R.messages.length) {
      h += '<h3>Checks</h3><ul class="msgs" id="msgs">' + R.messages.map((m) => '<li class="' + m.level + '">' + esc(m.text) + '</li>').join('') + '</ul>';
    } else {
      h += '<p class="help" style="color:var(--ok)">No problems found.</p>';
    }
    h += '</section>';

    // Diagrams
    h += '<section class="card" id="secDiagram"><h2>Layout</h2><div class="diagrams">' +
      '<div class="diag"><div class="cap">Side view (cut ring sizes, finished profile dashed)</div>' + sideSvg(R) + '</div>' +
      '<div class="diag"><div class="cap">Top view of ring <select id="ringPick" class="no-print" style="width:auto;min-height:32px;padding:2px 6px">' +
      design.rings.map((r, i) => '<option value="' + i + '"' + (i === selectedRing ? ' selected' : '') + '>' + (i + 1) + '</option>').join('') + '</select>' +
      '<span class="print-only">' + (selectedRing + 1) + '</span></div>' + topSvg(R, selectedRing) + '</div></div>' +
      legend(R) + '</section>';

    // Ring table
    h += '<section class="card" id="secRingTable"><h2>Ring details</h2><p class="help beginner-only">Angles are measured from square, the way most miter saws are marked. Long point = outside edge. Width = how wide to rip each strip.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Ring</th><th class="num">Seg</th><th class="num">Miter</th><th class="num">Long point</th><th class="num">Short point</th><th class="num">Strip width</th><th class="num">Rough thick</th><th class="num">Outside / inside Ø</th><th>Notes</th></tr></thead><tbody>';
    for (let i = design.rings.length - 1; i >= 0; i--) {
      const g = R.rings[i], r = design.rings[i];
      if (g.errors.length) { h += '<tr><td>' + (i + 1) + '</td><td colspan="8" style="color:var(--err)">' + esc(g.errors[0]) + '</td></tr>'; continue; }
      const uneven = g.segs.some((x) => Math.abs(x.theta - g.segs[0].theta) > 1e-6);
      const s0 = g.segs[0];
      const notes = [];
      if (g.open) notes.push('Open, gap ' + fmt(g.gap));
      if (g.veneerT) notes.push('Veneer ' + fmt(g.veneerT));
      if (uneven) notes.push('Mixed sizes — see cut list');
      if (r.offsetHalf) notes.push('Brick lay');
      if (r.label) notes.unshift(r.label);
      h += '<tr><td>' + (i + 1) + '</td><td class="num">' + g.n + '</td><td class="num">' + (uneven ? 'mixed' : C.formatAngle(s0.theta)) + '</td>' +
        '<td class="num">' + (uneven ? '—' : fmtCut(s0.lOut)) + '</td><td class="num">' + (uneven ? '—' : fmtCut(s0.lIn)) + '</td>' +
        '<td class="num">' + fmtCut(g.W) + '</td><td class="num">' + fmtCut(g.roughT) + '</td>' +
        '<td class="num">' + esc(fmt(2 * g.R)) + ' / ' + esc(fmt(2 * Math.max(g.r, 0))) + '<span class="dec">centerline Ø ' + esc(fmt(2 * g.centerR)) + '</span></td><td>' + esc(notes.join('; ')) + '</td></tr>';
    }
    h += '</tbody></table></div></section>';

    // Cut list
    h += cutListHtml(R);

    // Shopping
    h += shoppingHtml(R);

    // Test fit
    h += testFitHtml(R);

    // Build checklist
    h += checklistHtml(R);

    // Template
    if (s.template) h += templateHtml(R);
    h += '<section class="card no-print no-hosted">' + chk('settings.template', 'Add a full-size (1:1) template of the selected ring to the printout', s.template) + '</section>';

    $('#results').innerHTML = h;
    if (errorCount) $('#secSummary').setAttribute('data-errors', errorCount);
  }

  function stat(k, v) { return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>'; }

  function legend(R) {
    const used = new Set();
    design.rings.forEach((r) => (r.pattern || []).forEach((p) => used.add(p)));
    design.rings.forEach((r) => { if (r.veneer && r.veneer.t > 0 && r.type !== 'open') used.add(r.veneer.species); if (r.lam && r.lam.on) r.lam.layers.forEach((l) => used.add(l.species)); });
    if (design.base.type === 'disc') used.add(design.base.species);
    used.delete('lam');
    return '<div class="chips" style="margin-top:8px">' + [...used].map((id) => '<span class="chip" style="padding:2px 8px">' + swatch(id) + ' ' + esc(spName(id)) + '</span>').join('') + '</div>';
  }

  function sideSvg(R) {
    const rings = R.rings;
    const H = R.roughH || 1;
    const maxR = Math.max(R.maxR + design.settings.turnAllow, 0.5);
    const pad = 0.3;
    const Wd = 2 * maxR + 2 * pad, Hd = H + 2 * pad;
    let g = '';
    let z = 0;
    const y = (zz) => Hd - pad - zz;
    const base = R.base;
    if (base.type === 'disc') {
      const br = base.side / 2;
      g += '<rect x="' + (maxR + pad - br) + '" y="' + y(base.roughT) + '" width="' + 2 * br + '" height="' + base.roughT + '" fill="' + esc(spSolid(base.species)) + '" stroke="#000" stroke-width="0.01" stroke-opacity=".4"/>';
      z = base.roughT;
    }
    rings.forEach((gm, i) => {
      const t = gm.roughT || 0;
      if (!gm.errors.length && gm.segs.length) {
        const r = design.rings[i];
        const sps = (r.pattern || []);
        const col = spSolid(sps[0] === 'lam' ? (r.lam.layers[0] || {}).species : sps[0]);
        const col2 = sps.length > 1 ? spSolid(sps[1] === 'lam' ? (r.lam.layers[0] || {}).species : sps[1]) : col;
        const x0 = maxR + pad;
        for (const side of [-1, 1]) {
          const xa = x0 + side * gm.aIn, xb = x0 + side * gm.Ro;
          const xl = Math.min(xa, xb), w = Math.abs(xb - xa);
          g += '<rect x="' + xl + '" y="' + y(z + t) + '" width="' + w + '" height="' + t + '" fill="' + esc(side < 0 ? col : col2) + '" stroke="#000" stroke-width="0.01" stroke-opacity=".4"' + (gm.open ? ' fill-opacity=".55"' : '') + '><title>Ring ' + (i + 1) + '</title></rect>';
        }
        if (i === selectedRing) g += '<rect x="' + (pad * 0.3) + '" y="' + y(z + t) + '" width="' + (Wd - pad * 0.6) + '" height="' + t + '" fill="none" style="stroke:var(--accent)" stroke-width="0.03" stroke-dasharray="0.08 0.05"/>';
      }
      z += t;
    });
    // finished profile (outer and inner) for each ring band
    z = base.roughT || 0;
    let outer = [], inner = [];
    rings.forEach((gm, i) => {
      const t = gm.roughT || 0;
      if (!gm.errors.length) {
        outer.push([gm.R, z], [gm.R, z + t]);
        inner.push([Math.max(gm.r, 0), z], [Math.max(gm.r, 0), z + t]);
      }
      z += t;
    });
    const x0 = maxR + pad;
    const path = (pts, s) => pts.map((p, k) => (k ? 'L' : 'M') + (x0 + s * p[0]).toFixed(3) + ' ' + y(p[1]).toFixed(3)).join(' ');
    for (const s of [-1, 1]) {
      if (outer.length) g += '<path d="' + path(outer, s) + '" fill="none" style="stroke:var(--ink)" stroke-width="0.025" stroke-dasharray="0.08 0.06"/>';
      if (inner.length) g += '<path d="' + path(inner, s) + '" fill="none" style="stroke:var(--ink)" stroke-width="0.025" stroke-dasharray="0.08 0.06"/>';
    }
    g += '<line x1="' + x0 + '" y1="' + (pad * 0.5) + '" x2="' + x0 + '" y2="' + (Hd - pad * 0.5) + '" style="stroke:var(--muted)" stroke-width="0.015" stroke-dasharray="0.15 0.08"/>';
    return '<svg viewBox="0 0 ' + Wd.toFixed(3) + ' ' + Hd.toFixed(3) + '" role="img" aria-label="Side view of the ring stack" style="max-height:420px">' + g + '</svg>';
  }

  // Top view geometry shared by the diagram and the full-size template.
  function ringPolys(gm, r) {
    const polys = [];
    if (!gm || gm.errors.length || !gm.segs.length) return polys;
    const total = gm.segs.reduce((a, s) => a + s.theta, 0) * 2 * Math.PI / 180;
    const off = r.offsetHalf ? (gm.segs[0].theta * Math.PI / 180) : 0;
    const start = -Math.PI / 2 + off - gm.segs[0].theta * Math.PI / 180;
    for (const s of gm.segs) {
      const phi = start + s.center * (2 * Math.PI / total);
      const ux = Math.cos(phi), uy = Math.sin(phi), tx = -uy, ty = ux;
      const p = (a, l) => [a * ux + l * tx, a * uy + l * ty];
      polys.push({ species: s.species, pts: [p(gm.Ro, -s.lOut / 2), p(gm.Ro, s.lOut / 2), p(gm.aIn, s.lIn / 2), p(gm.aIn, -s.lIn / 2)] });
      if (gm.veneerT > 0) {
        const th = s.theta * Math.PI / 180;
        const jphi = phi + th; // joint line after this segment
        const jx = Math.cos(jphi), jy = Math.sin(jphi);
        polys.push({ veneer: true, species: gm.veneerSpecies, line: [[jx * gm.aIn / Math.cos(th), jy * gm.aIn / Math.cos(th)], [jx * gm.Ro / Math.cos(th), jy * gm.Ro / Math.cos(th)]], w: gm.veneerT });
      }
    }
    return polys;
  }

  function polySvg(gm, r, scaleUnit) {
    let g = '';
    const ptsStr = (pts) => pts.map((p) => p[0].toFixed(4) + ',' + p[1].toFixed(4)).join(' ');
    let num = 0;
    for (const P of ringPolys(gm, r)) {
      if (P.veneer) {
        g += '<line x1="' + P.line[0][0] + '" y1="' + P.line[0][1] + '" x2="' + P.line[1][0] + '" y2="' + P.line[1][1] + '" stroke="' + esc(spSolid(P.species)) + '" stroke-width="' + Math.max(P.w, 0.02) + '"/>';
      } else {
        const fill = P.species === 'lam' ? 'url(#lamfill)' : esc(spSolid(P.species));
        g += '<polygon points="' + ptsStr(P.pts) + '" fill="' + fill + '" stroke="#000" stroke-opacity=".45" stroke-width="' + (scaleUnit * 0.012) + '"/>';
        num++;
        if (scaleUnit) {
          const cx = P.pts.reduce((a, p) => a + p[0], 0) / 4, cy = P.pts.reduce((a, p) => a + p[1], 0) / 4;
          g += '<text x="' + cx.toFixed(3) + '" y="' + cy.toFixed(3) + '" font-size="' + (scaleUnit * 0.16) + '" text-anchor="middle" dominant-baseline="middle" fill="#000" stroke="#fff" stroke-width="' + (scaleUnit * 0.02) + '" paint-order="stroke">' + num + '</text>';
        }
      }
    }
    g += '<circle r="' + gm.R + '" fill="none" style="stroke:var(--ink)" stroke-width="' + (scaleUnit * 0.015) + '" stroke-dasharray="' + (scaleUnit * 0.08) + ' ' + (scaleUnit * 0.06) + '"/>';
    if (gm.r > 0) g += '<circle r="' + gm.r + '" fill="none" style="stroke:var(--ink)" stroke-width="' + (scaleUnit * 0.015) + '" stroke-dasharray="' + (scaleUnit * 0.08) + ' ' + (scaleUnit * 0.06) + '"/>';
    return g;
  }

  const lamDefs = () => {
    const ring = design.rings[selectedRing];
    const layers = ring && ring.lam && ring.lam.on ? ring.lam.layers : [{ species: 'maple' }, { species: 'walnut' }];
    const n = Math.max(layers.length, 1);
    return '<defs><pattern id="lamfill" patternUnits="userSpaceOnUse" width="0.4" height="' + (0.08 * n) + '">' +
      layers.map((l, k) => '<rect y="' + (0.08 * k) + '" width="0.4" height="0.08" fill="' + esc(spSolid(l.species)) + '"/>').join('') + '</pattern></defs>';
  };

  function topSvg(R, i) {
    const gm = R.rings[i];
    if (!gm || gm.errors.length) return '<p class="help">No diagram — fix this ring first.</p>';
    const ext = (gm.cornerR || gm.Ro) + 0.2;
    return '<svg viewBox="' + (-ext) + ' ' + (-ext) + ' ' + 2 * ext + ' ' + 2 * ext + '" role="img" aria-label="Top view of ring ' + (i + 1) + '" style="max-height:420px">' + lamDefs() + polySvg(gm, design.rings[i], ext / 3) + '</svg>';
  }

  function templateHtml(R) {
    const gm = R.rings[selectedRing];
    if (!gm || gm.errors.length) return '';
    const ext = (gm.cornerR || gm.Ro) + 0.25;
    return '<section class="card tpl print-only"><h2>Full-size template — ring ' + (selectedRing + 1) + '</h2><p class="help">Print at 100% (no "fit to page"). Check the 1″ bar with a ruler.</p>' +
      '<svg width="1in" height="0.15in" viewBox="0 0 1 0.15"><rect width="1" height="0.15" fill="#000"/></svg>' +
      '<svg width="' + (2 * ext).toFixed(3) + 'in" height="' + (2 * ext).toFixed(3) + 'in" viewBox="' + (-ext) + ' ' + (-ext) + ' ' + 2 * ext + ' ' + 2 * ext + '">' + lamDefs() + polySvg(gm, design.rings[selectedRing], 1) + '</svg></section>';
  }

  function cutListHtml(R) {
    const cut = R.cut;
    const s = design.settings;
    const tool = cut.tool;
    let h = '<section class="card" id="secCutList"><h2>Cut list</h2>';
    h += '<div class="safety-note" id="safetyNote"><b>Safety length:</b> every strip below includes <b>' + esc(fmt(cut.safety)) + '</b> of extra length, shown as its own line. ' +
      'It keeps your hands away from the blade while you cut the last pieces. Change it in Step 4 if you have your own safe method that wastes less wood. Cutting small pieces is hazardous — use your own judgment.</div>';
    if (design.rings.some((r) => r.type === 'open')) h += '<div class="open-note">This design has open-segment rings. The finished piece is decorative and <b>will not hold water</b>.</div>';
    h += '<p class="help">' + esc(tool.name) + ': blade kerf ' + esc(fmt(cut.kerf)) + (cut.cleanup ? ', plus ' + esc(fmt(cut.cleanup)) + ' per piece to sand off' : '') + '.</p>';

    // How many of each piece
    h += '<h3>Pieces to cut</h3><p class="help beginner-only">How many of each size to make. Same wood, angle, and length are grouped even when they go into different rings.</p>';
    h += '<div class="tbl-wrap"><table id="tallyTable"><thead><tr><th>Wood</th><th class="num">Qty</th><th class="num">Angle</th><th class="num">Long point</th><th class="num">Short point</th><th class="num">Width</th><th class="num">Thick</th><th>Rings</th></tr></thead><tbody>';
    const tally = cut.tally.slice().sort((a, b) => spName(a.species).localeCompare(spName(b.species)) || b.lOut - a.lOut);
    for (const t of tally) {
      const wood = t.species === 'lam' ? 'Laminated (ring ' + (t.lamRing + 1) + ')' : spName(t.species);
      h += '<tr><td>' + (t.species === 'lam' ? '' : swatch(t.species) + ' ') + esc(wood) + '</td><td class="num"><b>' + t.count + '</b></td><td class="num">' + C.formatAngle(t.theta) + '</td>' +
        '<td class="num">' + fmtCut(t.lOut) + '</td><td class="num">' + fmtCut(t.lIn) + '</td><td class="num">' + fmtCut(t.W) + '</td><td class="num">' + fmtCut(t.T) + '</td><td>' + [...t.rings].join(', ') + '</td></tr>';
    }
    h += '</tbody></table></div>';

    // Strips
    h += '<h3>Strips to rip</h3>';
    for (const st of cut.strips) {
      const color = st.kind === 'lam' ? '#888' : spSolid(st.species);
      const title = st.kind === 'lam' ? 'Laminated blank for ring ' + (st.ring + 1) : (st.kind === 'veneer' ? 'Veneer: ' + spName(st.species) : spName(st.species));
      h += '<div class="strip" style="border-left-color:' + esc(color) + '"><h4>Strip ' + esc(st.label) + ' — ' + esc(title) + '</h4>';
      if (st.kind === 'lam') {
        h += '<p class="help">Glue these layers face to face, then rip to width: ' + st.layers.map((l) => esc(spName(l.species)) + ' ' + esc(fmt(l.t))).join(' + ') + '</p>';
      }
      h += '<div class="muted" style="font-size:.9rem">' + (st.kind === 'veneer' ? 'Veneer thickness ' + esc(fmt(st.T)) + ', at least ' + esc(fmt(st.W)) + ' wide' : 'Thickness ' + esc(fmt(st.T)) + ' × width ' + esc(fmt(st.W))) + '</div>';
      h += '<div class="formula">Strip length = pieces ' + esc(fmt(st.piecesLen)) + ' + saw kerf ' + esc(fmt(st.kerfWaste)) +
        (st.trim ? ' + first angle trim ' + esc(fmt(st.trim)) : '') + (st.cleanWaste ? ' + sanding cleanup ' + esc(fmt(st.cleanWaste)) : '') +
        ' + <span class="safety">safety ' + esc(fmt(st.safety)) + '</span> = <b>' + esc(fmt(st.total)) + '</b></div>';
      h += '<ul style="margin:4px 0 0;padding-left:20px;font-size:.92rem">';
      for (const it of st.items) {
        if (st.kind === 'veneer') h += '<li><b>' + it.count + '</b> pieces ' + esc(fmt(it.lOut)) + ' long, square ends (rings ' + [...it.rings].join(', ') + ')</li>';
        else h += '<li><b>' + it.count + '</b> × ' + esc(C.formatAngle(it.theta)) + ' each end, long point ' + esc(fmt(it.lOut)) + ', short point ' + esc(fmt(it.lIn)) + ' (rings ' + [...it.rings].join(', ') + ')</li>';
      }
      h += '</ul>';
      if (st.kind !== 'veneer') {
        const ang = st.items[0].theta;
        h += '<p class="help" style="margin-top:6px">' + esc(tool.how.replace(/\{angle\}/g, C.formatAngle(ang)).replace(/\{comp\}/g, C.formatAngle(90 - ang))) + '</p>';
      }
      if (st.overMax) h += '<p class="help" style="color:var(--warn)">A single piece plus the safety length is longer than your maximum strip length.</p>';
      h += '</div>';
    }
    if (!cut.strips.length) h += '<p class="help">Nothing to cut yet.</p>';
    for (const n of cut.notes) h += '<p class="help" style="color:var(--warn)">' + esc(n) + '</p>';

    // Base blank
    if (R.base.type === 'disc') {
      const b = R.base;
      h += '<h3>Base blank</h3><div class="strip" style="border-left-color:' + esc(spSolid(b.species)) + '"><h4>' + esc(spName(b.species)) + ' base</h4>' +
        '<div>Square blank ' + esc(fmt(b.side)) + ' × ' + esc(fmt(b.side)) + ', ' + esc(fmt(b.blankT)) + ' thick. Turn to ' + esc(fmt(2 * b.R)) + ' diameter.</div>' +
        '<div class="help">Thickness = ' + esc(fmt(b.finishedT)) + ' finished + ' + esc(fmt(design.settings.sandAllow)) + ' sanding' + (b.addsHeight ? ' + ' + esc(fmt(b.depth)) + ' for the ' + esc(b.mount) : '') + '.' +
        (b.mount === 'recess' ? ' Cut a ' + esc(fmt(b.depth)) + ' deep recess for your chuck.' : '') +
        (b.mount === 'glueblock' ? ' Glue a ' + esc(fmt(b.depth)) + ' thick waste block (any wood) to the bottom for mounting.' : '') + '</div></div>';
    }
    h += '</section>';
    return h;
  }

  function shoppingHtml(R) {
    const by = R.cut.bySpecies;
    const b = R.base;
    const totals = {};
    for (const k in by) totals[k] = { bf: by[k].bf, stock: by[k].stock };
    if (b.type === 'disc') { totals[b.species] = totals[b.species] || { bf: 0, stock: [] }; totals[b.species].bf += b.bf; }
    let h = '<section class="card" id="secShop"><h2>Shopping list</h2><p class="help">Board feet of rough-milled stock (thickness × width × length ÷ 144), including safety lengths. Buy 20–30% extra for defects and planing.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Wood</th><th class="num">Board ft</th><th class="num">Strip length total</th><th class="num no-print">$ / bd ft</th><th class="num">Cost</th></tr></thead><tbody>';
    let costSum = 0, bfSum = 0;
    for (const k of Object.keys(totals).sort((a, c) => spName(a).localeCompare(spName(c)))) {
      const t = totals[k];
      const len = t.stock.reduce((a, s) => a + s.len, 0);
      const price = design.prices[k];
      const cost = price > 0 ? price * t.bf : 0;
      costSum += cost; bfSum += t.bf;
      h += '<tr><td>' + swatch(k) + ' ' + esc(spName(k)) + '</td><td class="num">' + t.bf.toFixed(2) + '</td><td class="num">' + (len ? esc(fmt(len)) : 'base only') + '</td>' +
        '<td class="num no-print"><input type="text" inputmode="decimal" style="max-width:90px;min-height:36px" data-bind="prices.' + esc(k) + '" data-type="num" value="' + (price > 0 ? price : '') + '" aria-label="Price per board foot"></td>' +
        '<td class="num">' + (cost ? '$' + cost.toFixed(2) : '—') + '</td></tr>';
    }
    h += '<tr><td><b>Total</b></td><td class="num"><b>' + bfSum.toFixed(2) + '</b></td><td></td><td class="no-print"></td><td class="num"><b>' + (costSum ? '$' + costSum.toFixed(2) : '—') + '</b></td></tr>';
    h += '</tbody></table></div></section>';
    return h;
  }

  function testFitHtml(R) {
    const err = design.settings.testErr;
    let h = '<section class="card" id="secFit"><h2>Test-fit check</h2><p class="help">Every segment has two cuts, so a tiny angle error adds up around the ring. This shows the gap at the last joint if each cut is off by the amount below. Cut a test ring from scrap first.</p>' +
      '<div class="grid no-print">' + numField('settings.testErr', 'Angle error per cut (degrees)', err, 'num') + '</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Ring</th><th class="num">Total error</th><th class="num">Gap at last joint</th></tr></thead><tbody>';
    for (let i = design.rings.length - 1; i >= 0; i--) {
      const g = R.rings[i];
      if (g.errors.length || g.open) continue;
      const tf = C.testFitGap(g.n, g.W, err || 0);
      h += '<tr><td>' + (i + 1) + '</td><td class="num">' + tf.totalDeg.toFixed(2) + '°</td><td class="num">' + esc(fmt(tf.gap)) + (U() === 'in' ? '<span class="dec">' + tf.gap.toFixed(3) + '″</span>' : '') + '</td></tr>';
    }
    h += '</tbody></table></div><p class="help">Gap on the outside = angle too small; gap on the inside = angle too big. If you glue two half-rings first, sand the half-ring faces flat on a disc sander and any small error disappears.</p></section>';
    return h;
  }

  function checklistHtml(R) {
    const steps = [];
    const add = (key, text) => steps.push({ key, text });
    const sps = new Set();
    R.cut.strips.forEach((st) => (st.layers || [{ species: st.species }]).forEach((l) => sps.add(l.species)));
    add('acclimate', 'Let all wood sit in your shop for a week or more so it is equally dry. Use stable, flat stock.');
    for (const k of sps) add('mill-' + k, 'Mill ' + spName(k) + ' flat and square to thickness.');
    for (const st of R.cut.strips) add('strip-' + st.label + '-' + st.T.toFixed(3) + '-' + st.W.toFixed(3), 'Rip strip ' + st.label + ' (' + (st.kind === 'lam' ? 'laminated' : spName(st.species)) + ') to ' + fmt(st.W) + ' wide, ' + fmt(st.total) + ' long (includes ' + fmt(st.safety) + ' safety).');
    add('testcut', 'Cut a test ring from scrap and check the fit. Adjust the angle until there is no gap.');
    add('cut', 'Cut all pieces. Number them and keep each ring\'s pieces together in a labeled tray.');
    if (R.base.type === 'disc') add('base', 'Cut and glue up the base blank. Mount it on the lathe and true it flat.');
    design.rings.forEach((r, i) => {
      const g = R.rings[i];
      if (g.errors.length) return;
      const nm = 'Ring ' + (i + 1);
      if (g.open) add('ring-' + r.id + '-glue', nm + ': open ring — glue each segment directly onto the ring below, spacing gaps evenly with a ' + fmt(g.gap) + ' spacer. Mark the ring below so the pattern lines up.');
      else {
        add('ring-' + r.id + '-glue', nm + ': ' + (g.n % 2 ? 'glue the full ring with a band clamp.' : 'glue two half-rings, sand the half faces flat, then glue the halves together.') + ' Let it cure.');
        add('ring-' + r.id + '-flat', nm + ': flatten both faces to ' + fmt(g.roughT) + ' (sanding disc, drum sander, or on the lathe).');
        add('ring-' + r.id + '-stack', nm + ': glue onto the stack, centered' + (r.offsetHalf ? ', turned half a segment (joints over the middle of the segments below)' : ', joints lined up with your reference mark') + '. Press with a clamp or lathe tailstock.');
      }
    });
    add('turn', 'Turn the outside, then the inside, checking the wall often. Finish as you like.');
    const done = steps.filter((s) => design.checklist[s.key]).length;
    let h = '<section class="card" id="secBuild"><h2>Build checklist <span class="muted" style="font-size:.85rem">(' + done + ' of ' + steps.length + ' done)</span></h2>' +
      '<p class="help">Tick steps as you go — they are saved with the design.</p><ul class="checklist">';
    for (const s of steps) h += '<li><label><input type="checkbox" data-check="' + esc(s.key) + '"' + (design.checklist[s.key] ? ' checked' : '') + '><span>' + esc(s.text) + '</span></label></li>';
    h += '</ul><details style="margin-top:10px"><summary class="btn no-print" style="display:inline-flex;align-items:center">Glue-up tips</summary><ul style="font-size:.92rem">' +
      '<li>Draw a pencil line across each ring before stacking — it is your reference mark for lining up patterns.</li>' +
      '<li>Use just enough glue to see a thin squeeze-out line. Too much makes rings slide.</li>' +
      '<li>Flatten every ring on both faces before stacking. Gaps between rings come from rings that are not flat.</li>' +
      '<li>Stack one or two rings at a time and true the top face on the lathe before adding the next.</li>' +
      '<li>Keep end-grain feature rings thin, and do not mix very wet and very dry wood.</li></ul></details></section>';
    return h;
  }

  // ---------- Events ----------
  function onInput(e) {
    const el = e.target;
    const strict = e.type === 'change';
    const bad = () => { el.dataset.invalid = '1'; if (strict) el.classList.add('bad'); };
    if (el.dataset.spec != null) { updateCustomSpecies(el); return; }
    if (el.dataset.check != null) {
      design.checklist[el.dataset.check] = el.checked;
      save();
      const sec = $('#secBuild h2 .muted');
      if (sec) { const all = document.querySelectorAll('#secBuild [data-check]'); const n = [...all].filter((x) => x.checked).length; sec.textContent = '(' + n + ' of ' + all.length + ' done)'; }
      return;
    }
    const path = el.dataset.bind;
    if (!path) return;
    const type = el.dataset.type;
    let val;
    if (type === 'bool') val = el.checked;
    else if (type === 'str') val = el.value;
    else if (type === 'len') {
      if (el.value.trim() === '' && /\.sand$|mountDepth$/.test(path)) val = null;
      else {
        val = C.parseLength(el.value, U());
        const signed = path === 'profile.step';
        if (!isFinite(val) || (!signed && val < 0)) { bad(); return; }
      }
    } else if (type === 'int') {
      val = parseInt(el.value, 10);
      if (!(val >= 3 && val <= 200)) { bad(); return; }
    } else if (type === 'pct') {
      val = parseFloat(el.value) / 100;
      if (!(val > 0 && val < 1)) { bad(); return; }
    } else if (type === 'list') {
      val = el.value.split(/[,\s]+/).filter(Boolean).map(Number);
      if (!val.length || val.some((v) => !(v > 0))) { bad(); return; }
    } else { // num
      if (el.value.trim() === '' && path.startsWith('prices.')) val = null;
      else { val = parseFloat(el.value); if (!isFinite(val) || val < 0) { bad(); return; } }
    }
    if (type === 'str' && el.tagName === 'SELECT' && /^settings\.denom$/.test(path)) val = parseInt(val, 10);
    el.classList.remove('bad');
    delete el.dataset.invalid;
    if (path === 'profile.species') {
      // Rings and base that used the old main wood follow the new one.
      const old = design.profile.species;
      design.rings.forEach((r) => { if (r.pattern.length === 1 && r.pattern[0] === old) r.pattern = [val]; });
      if (design.base.species === old) design.base.species = val;
    }
    setPath(design, path, val);
    afterChange(path, el, e.type);
  }

  // Decides how much of the page needs redrawing after a field changes.
  function afterChange(path, el, evType) {
    const m = path.match(/^rings\.(\d+)\.(.+)$/);
    if (m && m[2] === 'segments') design.rings[+m[1]].customSeg = true;
    if (path === 'settings.tool') { design.settings.kerf = C.TOOLS[design.settings.tool].kerf; }
    if (path === 'name') { renderDesignSecOptionsOnly(); save(); return; }
    if (path.startsWith('profile.')) {
      const err = regenerate(design);
      if (evType === 'change' && el.tagName === 'SELECT') renderShape();
      renderRings();
      const se = $('#shapeErr');
      if (se) se.innerHTML = err ? '<ul class="msgs"><li class="error">' + esc(err) + '</li></ul>' : '';
      renderBase();
      renderResults();
      save();
      return;
    }
    const structural = /^(base\.(type|mount|autoDia)|settings\.(denom|tool)|rings\.\d+\.(type|openBy|lam\.on|pattern\.\d+))$/.test(path);
    if (structural) {
      if (path.startsWith('rings.')) renderRings();
      else if (path.startsWith('base.')) renderBase();
      else renderCutSettings();
      if (path === 'settings.denom') { renderRings(); renderBase(); }
    } else if (m) {
      const i = +m[1];
      const sum = $('#sum-' + i);
      if (sum) sum.innerHTML = ringSummary(design.rings[i], i);
      const cnt = $('#cnt-' + i);
      if (cnt) { const c = C.patternCounts(design.rings[i].pattern, design.rings[i].segments || 0); cnt.textContent = Object.keys(c).map((k) => c[k] + ' × ' + spName(k)).join(', '); }
    } else if (path === 'settings.safety') {
      const note = $('#secCut .safety-note');
      if (note) note.innerHTML = '<b>Safety:</b> each strip includes ' + esc(fmt(design.settings.safety)) + ' of extra length so your hands stay well away from the blade while cutting the last short pieces. If you have your own safe way to hold short stock (a sled, hold-down, or clamp-on jig), you can lower this. Cutting small pieces is hazardous — use your own judgment.';
    }
    if (path === 'settings.template' || path.startsWith('prices.') || path === 'settings.testErr') {
      // These live inside the results; redraw without losing the field the user is typing in.
      const id = el.getAttribute('data-bind');
      const pos = el.selectionStart;
      renderResults();
      const again = document.querySelector('[data-bind="' + id + '"]');
      if (again && el.type !== 'checkbox') { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }
    } else renderResults();
    save();
  }
  function renderDesignSecOptionsOnly() {
    const sel = $('#designPick');
    if (sel) { const o = sel.querySelector('option[value="' + design.id + '"]'); if (o) o.textContent = design.name; }
  }

  function updateCustomSpecies(el) {
    const k = +el.dataset.spec, f = el.dataset.field;
    const s = state.customSpecies[k];
    if (!s) return;
    if (f === 'shrink') { const v = parseFloat(el.value); s.shrink = isFinite(v) ? v : null; }
    else if (f === 'name') { if (!el.value.trim()) return; s.name = el.value.trim(); }
    else s.color = el.value;
    save();
    if (f !== 'name' || el.type !== 'text') { renderRings(); }
    renderResults();
  }

  function onAction(btn) {
    const a = btn.dataset.action;
    const i = btn.dataset.ring != null ? +btn.dataset.ring : null;
    const r = i != null ? design.rings[i] : null;
    switch (a) {
      case 'mode': design.mode = btn.dataset.value; renderAll(); break;
      case 'units': design.units = btn.dataset.value; renderAll(); break;
      case 'source': return;
      case 'suggest': {
        const maxR = Math.max(...design.rings.map((x) => x.outerR), design.profile.maxDia / 2);
        design.profile.segments = C.suggestSegments(maxR, design.settings.turnAllow);
        design.rings.forEach((x) => { x.customSeg = false; });
        regenerate(design); renderShape(); renderRings(); renderResults();
        toast('Suggested ' + design.profile.segments + ' segments (long point near 2″).');
        break;
      }
      case 'unlock': design.source = 'manual'; renderShape(); renderRings(); break;
      case 'add-ring': {
        const top = design.rings[design.rings.length - 1];
        const nr = C.defaultRing(top ? top.pattern[0] : design.profile.species);
        if (top) Object.assign(nr, { outerR: top.outerR, width: top.width, thickness: top.thickness, segments: top.segments, pattern: top.pattern.slice() });
        design.rings.push(nr); openRings.add(nr.id); selectedRing = design.rings.length - 1;
        renderRings(); renderBase(); break;
      }
      case 'ring-del': if (askConfirm('Delete ring ' + (i + 1) + '?', 'ring' + r.id)) { design.rings.splice(i, 1); renderRings(); renderBase(); } break;
      case 'ring-dup': { const c = JSON.parse(JSON.stringify(r)); c.id = C.defaultRing().id; design.rings.splice(i + 1, 0, c); openRings.add(c.id); if (design.source === 'profile') design.source = 'manual'; renderShape(); renderRings(); break; }
      case 'ring-up': if (i < design.rings.length - 1) { swapRings(i, i + 1); } break;
      case 'ring-down': if (i > 0) { swapRings(i, i - 1); } break;
      case 'ring-show': selectedRing = i; renderResults(); $('#secDiagram').scrollIntoView({ behavior: 'smooth' }); return save();
      case 'pat-add': r.pattern.push(r.pattern[r.pattern.length - 1]); renderRings(); break;
      case 'pat-del': r.pattern.splice(+btn.dataset.k, 1); renderRings(); break;
      case 'lam-add': r.lam.layers.push({ species: 'maple', t: 0.25 }); renderRings(); break;
      case 'lam-del': r.lam.layers.splice(+btn.dataset.k, 1); renderRings(); break;
      case 'pattern-all': { const src = design.rings[0]; if (!src) break; design.rings.forEach((x) => { x.pattern = src.pattern.slice(); }); renderRings(); break; }
      case 'brick-all': design.rings.forEach((x, k) => { x.offsetHalf = k % 2 === 1; }); renderRings(); break;
      case 'apply-prog': {
        const a0 = C.parseLength($('#progStart').value, U()), st = C.parseLength($('#progStep').value, U());
        if (!(a0 > 0) || !isFinite(st)) { toast('Enter a start thickness and a change per ring.'); return; }
        design.rings.forEach((x, k) => { x.thickness = Math.max(0.125, a0 + k * st); });
        renderRings(); break;
      }
      case 'new-design': { const d = sampleDesign('bowl'); d.name = 'New design'; addDesign(d); return; }
      case 'dup-design': { const d = JSON.parse(JSON.stringify(design)); d.id = newDesign().id; d.name = design.name + ' (copy)'; addDesign(d); return; }
      case 'del-design': {
        if (Object.keys(state.designs).length <= 1) { toast('This is your only design.'); return; }
        if (!askConfirm('Delete "' + design.name + '"? This cannot be undone.', 'design' + design.id)) return;
        delete state.designs[design.id];
        state.currentId = Object.keys(state.designs)[0];
        design = state.designs[state.currentId]; renderAll(); saveNow(); return;
      }
      case 'code-make': {
        const box = $('#shareBox');
        box.value = C.encodeDesign(portable());
        box.focus(); box.select();
        const done = () => toast('Code copied. Paste it into a message.');
        const fail = () => toast('Code ready. Select it and copy.');
        try { navigator.clipboard.writeText(box.value).then(done, fail); } catch (e) { fail(); }
        return;
      }
      case 'code-open': {
        let txt = $('#shareBox').value.trim();
        const m = txt.match(/#d=([A-Za-z0-9_-]+)/);
        if (m) txt = m[1];
        if (!txt) { toast('Paste a share code first.'); return; }
        try { importPortable(C.decodeDesign(txt)); } catch (e) { toast('That code could not be read.'); }
        return;
      }
      case 'share': shareLink(); return;
      case 'export': exportFile(); return;
      case 'print': saveNow(); window.print(); return;
      case 'spec-add': {
        const name = $('#newSpecName').value.trim();
        if (!name) { toast('Type a name for the new wood.'); return; }
        state.customSpecies.push({ id: 'c-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36).slice(-4), name, color: $('#newSpecColor').value, shrink: null, custom: true });
        saveNow(); renderSpecies(); renderShape(); renderRings(); renderBase(); renderResults();
        $('#secSpecies details').open = true;
        toast('Added ' + name + '.');
        return;
      }
      case 'spec-del': {
        const s = state.customSpecies[+btn.dataset.k];
        const inUse = Object.values(state.designs).some((d) => JSON.stringify(d).includes('"' + s.id + '"'));
        if (inUse && !askConfirm(s.name + ' is used in a design. Delete anyway?', 'spec' + s.id)) return;
        state.customSpecies.splice(+btn.dataset.k, 1);
        saveNow(); renderSpecies(); renderRings(); renderResults(); $('#secSpecies details').open = true; return;
      }
      default: return;
    }
    renderResults();
    save();
  }
  function swapRings(a, b) {
    const t = design.rings[a]; design.rings[a] = design.rings[b]; design.rings[b] = t;
    if (design.source === 'profile') design.source = 'manual';
    renderShape(); renderRings(); renderBase();
  }
  function addDesign(d) {
    state.designs[d.id] = migrate(d);
    state.currentId = d.id;
    design = state.designs[d.id];
    openRings = new Set(); selectedRing = 0;
    renderAll(); saveNow();
    toast('Opened "' + d.name + '".');
  }

  // Bundles any custom species the design uses, so shared designs show the right woods.
  function portable() {
    const ids = JSON.stringify(design);
    const used = state.customSpecies.filter((s) => ids.includes('"' + s.id + '"'));
    return { app: 'segment-calculator', v: 1, design, species: used };
  }
  function importPortable(obj) {
    if (!obj || !obj.design || !Array.isArray(obj.design.rings)) throw new Error('Not a Segment Calculator design');
    for (const s of (obj.species || [])) if (!state.customSpecies.some((x) => x.id === s.id)) state.customSpecies.push(s);
    const d = obj.design;
    d.id = newDesign().id;
    if (state.designs[d.id]) d.id += 'x';
    addDesign(d);
  }
  function shareLink() {
    const url = location.href.split('#')[0] + '#d=' + C.encodeDesign(portable());
    const done = () => toast('Share link copied. Anyone who opens it gets a copy of this design.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('Copy this link:', url));
    else prompt('Copy this link:', url);
    window.__lastShareUrl = url;
  }
  function exportFile() {
    const blob = new Blob([JSON.stringify(portable(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (design.name || 'design').replace(/[^a-z0-9 _-]+/gi, '').trim().replace(/\s+/g, '-') + '.segcalc.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function toast(msg, ms) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms || 2600);
  }

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio' || el.type === 'color') return; // handled on change
    if (el.dataset.bind === 'profile.points' || el.dataset.bind === 'name') { onInput(e); return; }
    onInput(e);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'designPick') { state.currentId = el.value; design = state.designs[el.value]; openRings = new Set(); selectedRing = 0; renderAll(); saveNow(); return; }
    if (el.id === 'samplePick') { if (el.value) addDesign(sampleDesign(el.value)); return; }
    if (el.id === 'ringPick') { selectedRing = +el.value; renderResults(); save(); return; }
    if (el.id === 'importFile') {
      const f = el.files[0]; if (!f) return;
      f.text().then((txt) => { importPortable(JSON.parse(txt)); }).catch(() => toast('That file is not a Segment Calculator design.'));
      return;
    }
    if (el.dataset.action === 'source') {
      design.source = el.value;
      if (design.source === 'profile') regenerate(design);
      renderShape(); renderRings(); renderBase(); renderResults(); save(); return;
    }
    if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'color' || el.dataset.spec != null) { onInput(e); return; }
    // Text fields: flag bad values, and tidy the display after the user leaves the box.
    if (el.dataset.invalid) { el.classList.add('bad'); return; }
    if (el.dataset.type === 'len' && !el.classList.contains('bad') && el.value.trim() !== '') {
      const v = getPath(design, el.dataset.bind);
      if (typeof v === 'number') el.value = inputVal(v);
    }
  });
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.tagName === 'INPUT') return;
    onAction(btn);
  });
  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!d.matches || !d.matches('details.ring')) return;
    const r = design.rings[+d.dataset.ring];
    if (!r) return;
    if (d.open) { openRings.add(r.id); selectedRing = +d.dataset.ring; const pick = $('#ringPick'); if (pick && +pick.value !== selectedRing) { renderResults(); } }
    else openRings.delete(r.id);
  }, true);

  // Load a shared design from the link, if present.
  function loadFromHash() {
    const m = location.hash.match(/^#d=(.+)$/);
    if (!m) return;
    try {
      const obj = C.decodeDesign(m[1]);
      history.replaceState(null, '', location.href.split('#')[0]);
      importPortable(obj);
      toast('Loaded shared design "' + obj.design.name + '".');
    } catch (err) { toast('That share link could not be read.'); }
  }

  try {
    if (HOSTED) document.body.classList.add('hosted');
    renderAll();
    loadFromHash();
  } catch (err) {
    app.innerHTML = '<div class="card"><h2>Something went wrong</h2><p>The calculator could not start: ' + esc(err && err.message) +
      '</p><p>Try opening this file in a normal browser (Chrome, Safari, Edge, or Firefox). If it still fails, clear this site\'s saved data and reload.</p>' +
      '<button type="button" id="resetData">Clear saved data and reload</button></div>';
    $('#resetData').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } location.reload(); };
  }
  window.__segApp = { get design() { return design; }, get state() { return state; }, get result() { return lastResult; }, saveNow };
})();
</script>
</body>
</html>
